name: growth-discover

on:
  schedule:
    # Weekdays at 14:00 UTC (10:00 ET, 07:00 PT). Hits the live site's cron
    # endpoint which web-searches for fresh sales prospects (debt buyers,
    # brokers, agencies, funds), drafts an email for each, and queues them for
    # one-tap approval at /app/growth. If the growth config has auto-send on,
    # it also ships up to the daily cap automatically.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Confirm endpoint auth only (GET), don't run discovery"
        required: false
        default: "false"

concurrency:
  group: growth-discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm required secrets
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET secret is not set on this repo."
            exit 1
          fi
          if [ -z "${{ secrets.SITE_URL }}" ]; then
            echo "::error::SITE_URL secret is not set on this repo (e.g. https://tradeline.io)."
            exit 1
          fi

      - name: Fire discovery (POST /api/cron/growth-discover)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry-run requested; GET to confirm auth only (no discovery)."
            curl -sS -X GET \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "X-Tradeline-Source: github-actions-dry-run" \
              "$SITE_URL/api/cron/growth-discover" | tee /tmp/cron-out.json
          else
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "X-Tradeline-Source: github-actions" \
              "$SITE_URL/api/cron/growth-discover" | tee /tmp/cron-out.json
          fi
          echo

      - name: Print summary
        if: always()
        run: |
          if [ -f /tmp/cron-out.json ]; then
            echo "=== response ==="
            cat /tmp/cron-out.json
          fi
